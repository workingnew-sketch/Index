<style>
:root{
  --bg:#7d5a3a; --bg2:#8f6a47; --ink:#f8f0e5; --mute:rgba(248,240,229,.78); --gold:#f2d8a8;
  --accent:#2a201a; --accent-ink:#f2d8a8; --line:rgba(248,240,229,.2);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--bg);
  min-height:100dvh;display:flex;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
  overflow-x:hidden;position:relative;transition:background .6s var(--ease);
}
body::before{ /* slow drifting glow */
  content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 15%,rgba(255,226,170,.30),transparent 70%),
    radial-gradient(45% 40% at 85% 90%,rgba(30,18,10,.32),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.06)}}
.card{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0}

.logo-wrap{
  width:min(230px,62vw);aspect-ratio:3/4;border-radius:30px;display:grid;place-items:center;overflow:hidden;position:relative;
  background:var(--bg2);border:1px solid var(--line);
  box-shadow:0 0 0 8px rgba(255,255,255,.14),0 30px 60px -22px rgba(20,12,6,.7);
  animation:float 7s ease-in-out 1.4s infinite alternate;
}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.monogram{font-family:var(--serif);font-size:54px;color:var(--accent);letter-spacing:.02em}
@keyframes float{to{transform:translateY(-6px)}}

h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,9vw,44px);letter-spacing:-.01em;margin-top:26px;line-height:1.05}
.role{margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.rule{width:44px;height:1px;background:var(--gold);margin:22px 0 26px;opacity:.7;transform-origin:center}

.links{list-style:none;width:100%;display:grid;gap:12px}
.btn{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;
  padding:15px 18px;border-radius:20px;text-decoration:none;text-align:left;color:var(--ink);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .35s var(--ease),border-color .35s,background .35s,box-shadow .35s;
}
.btn::after{ /* sheen */
  content:"";position:absolute;inset:0;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transition:transform .8s var(--ease);
}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);transition:transform .35s var(--ease)}
.ico svg{width:22px;height:22px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:16px;letter-spacing:.005em}
.txt span{display:block;margin-top:3px;font-size:13px;color:var(--mute)}
.arrow{flex:none;width:18px;height:18px;color:var(--mute);transition:transform .35s var(--ease),color .35s}
@media (hover:hover){
  .btn:hover{transform:translateY(-3px);border-color:var(--gold);
    background:rgba(255,255,255,.2);box-shadow:0 18px 40px -18px rgba(20,12,6,.7)}
  .btn:hover::after{transform:translateX(120%)}
  .btn:hover .ico{transform:rotate(-6deg) scale(1.06)}
  .btn:hover .arrow{transform:translateX(4px);color:var(--gold)}
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.tagline{margin-top:34px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;color:var(--mute);max-width:30ch}
.tagline::before{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 auto 14px}

/* entrance choreography */
.in{opacity:0;transform:translateY(18px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
.logo-wrap.in{transform:scale(.88) translateY(10px);animation:pop 1.1s var(--ease) .1s forwards,float 7s ease-in-out 1.4s infinite alternate}
.rule.in{transform:scaleX(0);animation:grow .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes grow{to{opacity:.7;transform:scaleX(1)}}

@media (min-width:768px){
  body{padding:48px 24px}
  .card{max-width:480px}
  .logo-wrap{width:260px;border-radius:34px}
  .btn{padding:17px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .in{opacity:1;transform:none}
  .rule.in{opacity:.7;transform:none}
}
</style>
</head>

<script>
